name: Publish daily puzzle

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily puzzle job
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/daily-puzzle.js

      - name: Commit new puzzle files
        run: |
          git config user.name "footy-clues-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/puzzles public/players-index.json data/player-pool.json data/career-cache data/review-queue.json
          git diff --cached --quiet || git commit -m "Daily puzzle: $(date -u +%Y-%m-%d)"
          git push
